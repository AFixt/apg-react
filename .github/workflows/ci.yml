name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege by default. Jobs needing more (publish-storybook) declare it
# themselves; a job-level block replaces this one entirely.
permissions:
  contents: read

jobs:
  secrets:
    name: TruffleHog (verified secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          extra_args: --only-verified

  usecases:
    name: Validate use cases
    runs-on: ubuntu-latest
    # PR-triggered, not scheduled: this repo's CI policy bans cron, and a check
    # that reports hours after the fact gets ignored. See #144 -- 216 .uc.yaml
    # files were authored and maintained here with nothing ever checking them.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Validate use cases
        run: npm run validate:usecases
        env:
          # @afixt/usecase-runner is under the private @afixt scope. The
          # org-level secret is always the one to use; a repo-level NPM_TOKEN
          # would be stale and would 404 here.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unused files, exports and dependencies (Knip)
        run: npm run knip

      - name: Lint CSS (Stylelint)
        run: npm run stylelint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint markdown
        run: npm run markdownlint

      - name: Duplicate detection (jscpd)
        run: npm run dupes

      - name: License allowlist
        run: npm run license:check

      - name: npm audit (production, high+)
        run: npm run security:audit

      - name: Unit + accessibility tests
        run: npm test

      - name: Build library
        run: npm run build

      - name: Bundle size budget (size-limit)
        run: npm run size

      - name: Build Storybook
        run: npm run build-storybook

      - name: E2E tests (Puppeteer + Storybook static)
        run: npm run test:e2e
        env:
          # Puppeteer needs these flags in CI containers
          PUPPETEER_DISABLE_DEV_SHM_USAGE: "true"

  publish-storybook:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # actions/deploy-pages refuses to create a deployment without this, with
    # "Missing environment" and a 400. The job has carried the right permissions
    # since it was written but never this, so every push to main since
    # 2026-07-30 failed here — including the v2.0.0 and v2.1.0 releases.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - name: Upload Storybook to Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
