name: Security

# Scheduled runs are banned repo-wide (#127): a timer-triggered failure is
# attributable to nobody and gets ignored. These scans run on every PR (and
# on push to the integration branches), where a new finding blocks the change
# that introduced it. workflow_dispatch remains for manual runs.
#
# The former npm-audit job is gone from this file: the identical command
# (`npm audit --omit=dev --audit-level=high`) already gates every PR as the
# "npm audit (production, high+)" step of ci.yml.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. The codeql job declares its own wider block.
permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  osv-scanner:
    # This gates for real as of #137. The blanket dev exclusion that used to
    # cover the entire tree -- this package declares no production dependencies,
    # so excluding the dev group excluded everything -- is gone, and the scanner
    # now sees all 1350 packages. A green tick here means something again.
    name: OSV-Scanner (full dependency tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install OSV-Scanner
        run: |
          curl -sSL -o /tmp/osv-scanner \
            https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
      # osv-scanner.toml carries no category exclusions. The single entry in it
      # is a specific, dated ignore naming one advisory with no published fix.
      - run: osv-scanner --config=osv-scanner.toml --lockfile=package-lock.json

  semgrep:
    name: Semgrep (OWASP Top 10)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: |
          semgrep \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/react \
            --config=p/owasp-top-ten \
            --config=p/security-audit \
            --config=p/secrets \
            --error \
            --metrics=off
