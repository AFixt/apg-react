id: menu-button-tab-closes
title: "MenuButton — Tab closes the open menu"
type: positive
description: "Pressing Tab while the menu is open closes it and lets focus proceed to the
  next focusable element rather than remaining trapped."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-menubutton--default&viewMode=story"

expected_result: "After Tab the menu is closed (aria-expanded is false)."

steps:
  - locate: button "Actions"
  - focus: button "Actions"
  - keyboard: "Enter"
  - verify: button "Actions" attribute "aria-expanded" is "true"
  - keyboard: "Tab"
  - verify: button "Actions" attribute "aria-expanded" is "false"
