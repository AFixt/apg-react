id: tree-grid-arrow-up
title: "TreeGrid — ArrowUp moves focus to the previous visible row in the same column"
type: positive
description: "Per the APG, ArrowUp moves focus to the cell immediately above the current
  cell."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-treegrid--default-bare&viewMode=story"

expected_result: 'Focus moves from the "index.js" cell back up to the "src" cell.'

steps:
  - locate: role "gridcell" name "index.js"
  - focus: role "gridcell" name "index.js"
  - keyboard: "ArrowUp"
  - verify: focus role "gridcell" name "src"
