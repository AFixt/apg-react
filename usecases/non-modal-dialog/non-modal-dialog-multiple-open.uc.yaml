id: non-modal-dialog-multiple-open
title: "NonModalDialog — Two non-modal dialogs can be open at once, each with its own name"
type: positive
description: "Non-modal dialogs may legitimately coexist — modal ones may not. Both dialogs
  are present, each explicitly non-modal and each named by its own heading."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-nonmodaldialog--multiple-open-bare&viewMode=story"

expected_result: 'Dialogs named "Preferences" and "Filter options" are both present and non-modal.'

steps:
  - locate: dialog "Preferences"
  - locate: dialog "Filter options"
  - verify: dialog "Preferences" attribute "aria-modal" is "false"
  - verify: dialog "Filter options" attribute "aria-modal" is "false"
