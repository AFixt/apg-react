id: slider-vertical-arrow-down
title: "Slider — ArrowDown decrements a vertical slider"
type: positive
description: "On a vertical slider, ArrowDown decrements aria-valuenow by the configured
  step (here step=5)."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-slider--vertical-bare&viewMode=story"

expected_result: 'aria-valuenow becomes "20" after ArrowDown from "25" (step=5).'

steps:
  - locate: role "slider" name "Volume"
  - focus: role "slider" name "Volume"
  - keyboard: "ArrowDown"
  - verify: role "slider" name "Volume" attribute "aria-valuenow" is "20"
