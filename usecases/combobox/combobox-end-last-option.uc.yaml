id: combobox-end-last-option
title: "Combobox — End moves the active option to the last option"
type: positive
description: "While the popup is open, End moves virtual focus to the last option; Enter
  then commits it."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-combobox--autocomplete-list-bare&viewMode=story"

expected_result: 'After ArrowDown, End, Enter the input value is "Austria" (the last
  option).'

steps:
  - locate: select "Country (filters as you type)"
  - focus: select "Country (filters as you type)"
  - keyboard: "ArrowDown"
  - verify: select "Country (filters as you type)" attribute "aria-expanded" is "true"
  - keyboard: "End"
  - keyboard: "Enter"
  - verify: select "Country (filters as you type)" has_value "Austria"
