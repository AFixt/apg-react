id: feed-pageup-previous-article
title: "Feed — PageUp moves focus to the previous article"
type: positive
description: "Per the APG Feed pattern, PageUp moves focus from the article that contains
  focus to the previous article in the feed."

preconditions:
  - "Storybook is running on http://localhost:6006"
  - "The fetchArticles fixture resolves with three articles"

start_location: "http://localhost:6006/iframe.html?id=components-feed--default&viewMode=story"

expected_result: 'Focus moves from "Article 2" back to "Article 1".'

steps:
  - wait_for: heading "Article 2"
  - locate: role "article" name "Article 2"
  - focus: role "article" name "Article 2"
  - keyboard: "PageUp"
  - verify: focus role "article" name "Article 1"
