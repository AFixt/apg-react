id: radio-group-arrow-right-left
title: "RadioGroup — ArrowRight and ArrowLeft move selection like Down and Up"
type: positive
description: "Per the APG, the horizontal arrow keys are equivalent to the vertical ones
  in a radiogroup: ArrowRight moves focus and selection to the next radio, ArrowLeft to
  the previous."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-radiogroup--default-bare&viewMode=story"

expected_result: "ArrowRight selects SMS; ArrowLeft returns selection to Email."

steps:
  - locate: radio "Email"
  - focus: radio "Email"
  - keyboard: "ArrowRight"
  - verify: radio "SMS" attribute "aria-checked" is "true"
  - verify: radio "Email" attribute "aria-checked" is "false"
  - keyboard: "ArrowLeft"
  - verify: radio "Email" attribute "aria-checked" is "true"
  - verify: radio "SMS" attribute "aria-checked" is "false"
