id: menubar-submenu-arrow-left-previous-menu
title: "Menubar — ArrowLeft inside a submenu opens the previous menubar menu"
type: positive
description: "Within an open submenu, ArrowLeft closes the current submenu and opens the
  previous menubar menu with focus on its first item — the mirror of ArrowRight."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-menubar--default&viewMode=story"

expected_result: 'After ArrowLeft from inside the Edit submenu, focus is on "New" (first
  item of File).'

steps:
  - locate: menuitem "Edit"
  - focus: menuitem "Edit"
  - keyboard: "ArrowDown"
  - verify: focus menuitem "Undo"
  - keyboard: "ArrowLeft"
  - verify: focus menuitem "New"
