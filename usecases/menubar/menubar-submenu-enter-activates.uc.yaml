id: menubar-submenu-enter-activates
title: "Menubar — Enter activates the focused submenu item and closes the submenu"
type: positive
description: "Pressing Enter on a focused submenu item invokes it and closes the submenu,
  returning focus to the parent menubar item."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-menubar--default&viewMode=story"

expected_result: 'After Enter on "New", the File submenu is closed and focus is back on the
  File menubar item.'

steps:
  - locate: menuitem "File"
  - focus: menuitem "File"
  - keyboard: "ArrowDown"
  - verify: focus menuitem "New"
  - keyboard: "Enter"
  - verify: menuitem "File" attribute "aria-expanded" is "false"
  - verify: focus menuitem "File"
