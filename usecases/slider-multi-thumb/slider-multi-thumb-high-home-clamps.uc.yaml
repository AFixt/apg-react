id: slider-multi-thumb-high-home-clamps
title: "SliderMultiThumb — Home on the high thumb clamps to the low thumb value"
type: positive
description: "Pressing Home on the high thumb does not jump to the absolute minimum; it
  is clamped to the current low thumb value, preserving the range invariant."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-slidermultithumb--price-range-bare&viewMode=story"

expected_result: 'High aria-valuenow becomes "20" (the low value), not "0".'

steps:
  - locate: role "slider" name "Maximum price"
  - focus: role "slider" name "Maximum price"
  - keyboard: "Home"
  - verify: role "slider" name "Maximum price" attribute "aria-valuenow" is "20"
