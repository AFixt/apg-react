id: tree-view-arrow-up
title: "TreeView — ArrowUp moves focus to the previous visible treeitem"
type: positive
description: "Per the APG, ArrowUp moves focus to the previous visible treeitem
  regardless of nesting depth."

preconditions:
  - "Storybook is running on http://localhost:6006"

start_location: "http://localhost:6006/iframe.html?id=components-treeview--default-bare&viewMode=story"

expected_result: 'Focus moves from "components" back up to "src".'

steps:
  - locate: role "treeitem" name "components"
  - focus: role "treeitem" name "components"
  - keyboard: "ArrowUp"
  - verify: focus role "treeitem" name "src"
