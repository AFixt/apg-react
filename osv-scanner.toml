# OSV-Scanner configuration for the PR-time security workflow (#127).
#
# This file no longer excludes anything from the scan. It used to carry a
# blanket `group = "dev"` override, which silenced the ENTIRE dependency tree:
# package.json declares no `dependencies` at all -- react/react-dom are peers --
# so every entry in package-lock.json is marked dev, and excluding the dev group
# left the scanner nothing to look at. The job could not fail. That is resolved
# in #137: the toolchain advisories it was hiding have been fixed, and the
# scanner now sees every package.
#
# It currently accepts nothing. Any future entry must be a specific, dated
# `[[IgnoredVulns]]` naming a single advisory -- an `id`, an `ignoreUntil` date
# and a `reason` citing the issue -- never a package or a category, so that if
# it stops being true the job goes red. __tests__/tooling/osvConfig.test.js
# enforces that shape.
#
# Retired in #275, because osv-scanner reported each as an unused ignore and a
# dead entry would silently swallow the advisory if it were ever re-published:
#
#   GHSA-jmr9-qjv8-65gv, GHSA-7pqw-9j4j-h8q3  extract-zip, gone from the tree
#                                             since puppeteer 25 (#253)
#   GHSA-vfj7-8cjw-p6xm                       braces (#269); the advisory was
#                                             withdrawn on 2026-10-23
